<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        // 1. Get the video ID from the URL parameters (?v=ID)
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        const container = document.getElementById('container');

        if (videoId) {
            // 2. Construct the embed URL
            // Note: mute=1 is added because modern browsers block autoplay with sound.
            const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&showinfo=0&modestbranding=1`;

            container.innerHTML = `
                <iframe 
                    src="${embedUrl}" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        } else {
            container.innerHTML = `<h1 style="color: white; text-align: center; font-family: sans-serif; margin-top: 20%;">
                Missing Video ID!<br>Use: filename.html?v=7YyGPGoZU58
            </h1>`;
        }
    </script>
</body>
</html>
